<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacely</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141a1f" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg"><link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pacely">
<style>
/* Layout: pit-wall instrument. A quiet app shell (sticky bar + session strip), one content column, data set in a condensed display face and tabular mono. */
:root{
--bg:#f2f4f6;--sf:#ffffff;--sf2:#eceff2;--tx:#11151a;--mu:#5a6470;--fa:#8b949e;--ln:#dfe3e8;--lnb:#c3cad2;
--ac:#d4160c;--acx:#ffffff;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ref:#98a1ab;
--q1:#86b6ef;--q2:#5598e7;--q3:#2a78d6;--q4:#1c5cab;--q5:#104281;--o1:#f6b899;--o2:#ef8f62;--o3:#d95926;--o4:#9c3d14;--ok:#0d7a3b;--okbg:#e2f2e8;--wn:#94570a;--wnbg:#fcf0d9;--bd:#bf2329;--bdbg:#fbe5e5;
--f-disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
--f-body:"Barlow",-apple-system,"Segoe UI",system-ui,sans-serif;
--f-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--num:var(--f-disp);--r:10px;--r-sm:6px;--shadow:0 1px 2px rgba(17,21,26,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--o1:#7a3414;--o2:#b84a1c;--o3:#e06a35;--o4:#f5a37c;--q1:#184f95;--q2:#1c5cab;--q3:#2a78d6;--q4:#5598e7;--q5:#9ec5f4;--bg:#0c0f12;--sf:#141a1f;--sf2:#1b2228;--tx:#e6ebef;--mu:#95a1ad;--fa:#6b7783;--ln:#232b33;--lnb:#35404b;--ac:#ef3a2e;--acx:#ffffff;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ref:#6b7682;--ok:#45c27a;--okbg:#10291b;--wn:#e8a63a;--wnbg:#2a2110;--bd:#ff6259;--bdbg:#311718;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--o1:#7a3414;--o2:#b84a1c;--o3:#e06a35;--o4:#f5a37c;--q1:#184f95;--q2:#1c5cab;--q3:#2a78d6;--q4:#5598e7;--q5:#9ec5f4;--bg:#0c0f12;--sf:#141a1f;--sf2:#1b2228;--tx:#e6ebef;--mu:#95a1ad;--fa:#6b7783;--ln:#232b33;--lnb:#35404b;--ac:#ef3a2e;--acx:#ffffff;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ref:#6b7682;--ok:#45c27a;--okbg:#10291b;--wn:#e8a63a;--wnbg:#2a2110;--bd:#ff6259;--bdbg:#311718;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sf)}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance}
main{max-width:1240px;margin:0 auto;padding-block:8px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- app bar ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sf);border-bottom:1px solid var(--ln)}
.topin{max-width:1240px;margin:0 auto;min-height:56px;display:flex;align-items:center;gap:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{display:flex;align-items:center;gap:9px;flex:none}.logo{width:26px;height:26px;color:var(--tx)}
.mark h1{margin:0;font:700 22px/1 var(--f-disp);letter-spacing:.01em;text-transform:uppercase}
nav.tabs{display:flex;gap:2px;align-self:stretch}
.tabs button{position:relative;background:none;border:0;border-radius:0;color:var(--mu);font:600 14px/1 var(--f-disp);letter-spacing:.07em;text-transform:uppercase;padding:0 14px;min-height:56px;cursor:pointer}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--tx)}.tabs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--ac)}
.tools{margin-left:auto;display:flex;gap:8px}
.tools button{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:var(--r-sm);min-height:32px;padding:0 10px;font:500 13px var(--f-body);cursor:pointer}
.tools button:hover{color:var(--tx);border-color:var(--lnb)}

/* ---- type ---- */
h2{display:flex;align-items:baseline;gap:10px;margin:36px 0 12px;font:600 15px/1.2 var(--f-disp);letter-spacing:.09em;text-transform:uppercase;color:var(--tx)}
h2 small{font:500 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--mu)}
h3{font:600 17px/1.3 var(--f-body);margin:0}
.hint{color:var(--mu);font-size:14px;margin:10px 0 0;max-width:72ch}
.foot{color:var(--fa);font-size:12.5px;margin:24px 0 0;max-width:80ch}
.mu{color:var(--mu)}.err{color:var(--bd);font-weight:600;margin:10px 0 0}
.k{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}

/* ---- surfaces ---- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.notice{margin-top:16px;padding:11px 14px;border-radius:var(--r-sm);background:var(--wnbg);color:var(--tx);font-size:14px;border:1px solid transparent}
.notice.bad{background:var(--bdbg)}
.empty{margin-top:28px;padding:56px 24px;text-align:center;color:var(--mu);background:var(--sf);border:1px dashed var(--lnb);border-radius:var(--r)}
.empty svg{display:block;margin:0 auto 14px;width:44px;height:44px;color:var(--tx)}
.empty b{display:block;font:700 34px/1.05 var(--f-disp);letter-spacing:.01em;text-transform:uppercase;color:var(--tx);margin-bottom:10px}

/* ---- controls ---- */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,label.btn{font:600 14px/1 var(--f-body);border-radius:var(--r-sm);min-height:40px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--ac);color:var(--acx)}
button:hover,label.btn:hover{filter:brightness(1.08)}
button.alt{background:var(--sf);color:var(--tx);border-color:var(--lnb)}
button.alt:hover{filter:none;background:var(--sf2)}
button.sm{min-height:34px;padding:0 12px;font-size:13px}
button[disabled]{opacity:.5;cursor:default}
button.link{background:none;border:0;padding:0;min-height:0;color:var(--tx);text-decoration:underline;text-underline-offset:3px;font-weight:600}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
input[type=number],input[type=text],select{font:500 15px var(--f-body);color:var(--tx);background:var(--sf);border:1px solid var(--lnb);border-radius:var(--r-sm);min-height:40px;padding:6px 10px;max-width:100%}
input[type=number]{width:120px}input[type=text]{width:100%}
label.f2,.fld{display:flex;flex-direction:column;gap:5px;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
label.f2 input,.fld input,.fld select{text-transform:none;letter-spacing:0}
details>summary{cursor:pointer;color:var(--mu);font-weight:600;font-size:14px;padding:12px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";display:inline-block;width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin:0 10px 2px 2px;transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
details>summary:hover{color:var(--tx)}
details.set{margin-top:18px;border-top:1px solid var(--ln)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--sf);color:var(--tx);border:1px solid var(--lnb);border-radius:999px;min-height:34px;padding:0 14px;font:500 13.5px var(--f-body)}
.chip:hover{filter:none;border-color:var(--tx)}.chip.on{border-color:var(--tx);background:var(--sf2);box-shadow:inset 0 0 0 1px var(--tx)}.chip.dim{opacity:.55}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.inl{display:flex;align-items:center;gap:10px}.inl label{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.grid2{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.pick{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:620px){.pick{grid-template-columns:1fr 1fr}}
.pk{display:grid;gap:12px;align-content:start}
.pick label{display:flex;flex-direction:column;gap:5px;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.pick select{width:100%}

/* ---- import panel ---- */
.card.ctrl{margin-top:20px;display:grid;gap:4px}
.card.ctrl>.row label.btn{background:var(--ac);color:var(--acx)}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--ln)}@media(min-width:620px){.mrow{grid-template-columns:240px minmax(0,380px);align-items:center;gap:16px}}
.mrow>span{font-weight:600;font-size:14px}.mrow>span small{display:block;color:var(--mu);font-weight:400;font-size:12.5px}
.pv{overflow-x:auto;margin-top:14px;border:1px solid var(--ln);border-radius:var(--r-sm)}.pv table{border-collapse:collapse;font:12.5px var(--f-data);white-space:nowrap}.pv th,.pv td{padding:6px 10px;border-bottom:1px solid var(--ln);text-align:left}.pv th{color:var(--mu);font-family:var(--f-body);font-weight:600}.pv tr:last-child td{border-bottom:0}
.pklist{max-height:340px;overflow:auto;margin-top:12px;border:1px solid var(--ln);border-radius:var(--r-sm)}
.pkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.pkrow:last-child{border-bottom:0}.pkrow span{margin-left:auto;color:var(--mu);font:13px var(--f-data)}.pkrow input{width:18px;height:18px}

/* ---- session strip ---- */
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;margin-top:18px;padding:12px 16px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}
.cs{display:flex;align-items:center;gap:10px;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.cs select{min-height:36px;font:600 15px var(--f-body);letter-spacing:0;text-transform:none;max-width:min(320px,70vw)}.cs b{font:600 15px var(--f-body);letter-spacing:0;text-transform:none;color:var(--tx)}
.facts{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0}.facts div{display:flex;align-items:baseline;gap:8px}
.facts dt{font:600 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.facts dd{margin:0;font:500 15px var(--f-data)}.facts dd.sm{font:500 14px var(--f-body)}
.readn{margin:14px 0 0;color:var(--mu);font-size:13.5px}

/* ---- status ---- */
.tag{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--sf2);color:var(--tx);white-space:nowrap}
.tag.ok,.ok>.tag{background:var(--okbg);color:var(--ok)}.tag.med,.med>.tag{background:var(--wnbg);color:var(--wn)}.tag.high,.high>.tag{background:var(--bdbg);color:var(--bd)}

/* ---- headline call ---- */
.call,.verdict{margin-top:18px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow)}
.call .k,.verdict .k{display:flex;align-items:center;gap:8px}
.call .k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lnb)}
.call.ok .k::before{background:var(--ok)}.call.med .k::before{background:var(--wn)}.call.high .k::before{background:var(--bd)}
.call .big,.verdict .big{font:700 clamp(34px,6vw,56px)/1 var(--f-disp);letter-spacing:.005em;text-transform:uppercase;margin:12px 0 12px}
.call.high .big{color:var(--bd)}
.call .why,.verdict p{margin:0;max-width:70ch;color:var(--tx);font-size:16px}
.call .conf{margin:8px 0 0;color:var(--mu);font-size:13.5px}
.call .row{margin-top:18px;padding-top:16px;border-top:1px solid var(--ln)}
.call input[type=number]{width:96px}

/* ---- stat tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:14px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.tile{padding:16px 20px;border-left:1px solid var(--ln);min-width:0}.tile:first-child{border-left:0}
.tile .n{font:600 clamp(26px,3.6vw,38px)/1 var(--f-disp);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .n small{font:500 15px var(--f-body);color:var(--mu);margin-left:3px}
.tile .l{margin-top:8px;font-size:13px;color:var(--mu);line-height:1.35}

/* ---- findings ---- */
.fgrid{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:0 20px;box-shadow:var(--shadow)}
.f{padding:16px 0;border-top:1px solid var(--ln)}.f:first-child{border-top:0}
.f h3{margin:10px 0 6px}
.f p{margin:4px 0 0;color:var(--mu);font-size:14.5px}.f p.do,.f .do{color:var(--tx);font-weight:500}
.f dl{margin:8px 0 0;display:grid;gap:6px}.f dt{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}.f dd{margin:0}
.f details.why{margin-top:4px}.f details.why summary{padding:6px 0;font-size:13px}
.chg{list-style:none;margin:0;padding:0;display:grid;gap:12px}.chg li{display:flex;gap:12px;align-items:flex-start}.chg .tag{flex:none;margin-top:1px}

/* ---- corners ---- */
.cor{display:grid;gap:0;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:0 18px}
.cr{display:grid;grid-template-columns:52px auto minmax(0,1fr);gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}.cr:first-child{border-top:0}
.cr .nm,.cc .nm{font:700 20px var(--f-disp)}.cr .dt{color:var(--mu);font-size:14px}
.cch{display:grid;grid-template-columns:48px 1fr 1fr;gap:10px;padding:0 18px 6px;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.cc{display:grid;grid-template-columns:48px 1fr 1fr;gap:8px 10px;align-items:start;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px 18px;margin-bottom:8px}
.cc small{display:block;color:var(--mu);font-size:13px;margin-top:4px}

/* ---- tables ---- */
table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th{font:600 11.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);text-align:right;padding:10px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
.cmp td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--ln);font:500 14px var(--f-data);white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-family:var(--f-body)}.cmp tr:last-child td{border-bottom:0}
.cmp td.win{color:var(--ok);font-weight:700}
.tbl{overflow-x:auto}

/* ---- layout ---- */
.tabpane{min-width:0}
.dash{display:block}.colL,.colR{min-width:0}
@media(min-width:1000px){.dash{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 28px;align-items:start}.dash.cmpd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.evg+.evg{border-top:1px solid var(--ln);margin-top:12px;padding-top:12px}.evh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.evh span{color:var(--mu);font-size:14px}.evh button{margin-left:auto}.evg .chips{margin-top:8px}
.shh{margin:22px 0 4px}.shh h1{font:700 30px/1.1 var(--fc,'Barlow Condensed'),sans-serif;margin:4px 0}.shh p{margin:0;color:var(--mu)}.shh .k{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--s2)}
.shg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;margin-top:16px;align-items:start}@media(max-width:760px){.shg{grid-template-columns:1fr}}
.sc{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--s2);border-radius:10px;padding:12px 14px}.sc+.sc{margin-top:10px}.sch{display:flex;align-items:center;gap:10px}.sch b{font-size:18px}.scn{width:24px;height:24px;border-radius:50%;background:var(--s2);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}.scl{margin-left:auto;font:700 16px var(--mono,'JetBrains Mono'),monospace;color:var(--s2)}.scs{margin:6px 0 4px;color:var(--mu);font-size:14px}.sc ul{margin:4px 0 0;padding-left:18px}.sc li{font-size:14.5px;margin:3px 0}.shk{margin:14px 0 0}
.stint .sum{margin:10px 0 0}.stint .ign{color:var(--mu);font-size:14px;margin:4px 0 0}

/* ---- charts ---- */
svg{display:block;width:100%;height:auto;overflow:visible}
.axis{stroke:var(--lnb);stroke-width:1}.grid{stroke:var(--ln);stroke-width:1}
.t{fill:var(--mu);font:500 11px var(--f-data)}.tl{fill:var(--tx);font:600 11px var(--f-body);letter-spacing:.04em}
.trace{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.traceB{fill:none;stroke:var(--s2);stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round}
.traceR{fill:none;stroke:var(--ref);stroke-width:1.5;stroke-dasharray:5 4;stroke-linejoin:round}
.area{fill:var(--s1);opacity:.1}
.dot{fill:var(--sf);stroke:var(--s1);stroke-width:2}.dot.s{fill:var(--tx);stroke:var(--sf);stroke-width:2}
.mkB{fill:var(--sf);stroke:var(--s2);stroke-width:2}
.fitc{fill:none;stroke:var(--s1);stroke-width:2}.fitp{fill:none;stroke:var(--s1);stroke-width:2;stroke-dasharray:5 4}
.band{fill:var(--wn);opacity:.16}.flag{stroke:var(--tx);stroke-width:1.5}
.lg{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13.5px;color:var(--mu)}.lg span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:20px;height:0;border-top:2px solid var(--s1)}.sw.b{border-top:2px dashed var(--s2)}.sw.r{border-top:2px dashed var(--ref)}
.ovc{margin-top:16px}.ovt{display:flex;justify-content:space-between;gap:10px;font:600 12px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.ovx{stroke:var(--tx);stroke-width:1;opacity:.55}
.ovr{margin:10px 0 0;font:500 13px var(--f-data);color:var(--mu);min-height:1.6em}
#ovl svg,.xh svg{touch-action:pan-y}

/* ---- telemetry page ---- */
.lapbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px;margin-top:18px}
.lapbar .lt{font:700 clamp(40px,6vw,64px)/.9 var(--f-disp);letter-spacing:.005em}
.lapbar .dl{font:500 14px var(--f-data);color:var(--mu);margin-top:6px}
.tiles.six{grid-template-columns:repeat(6,minmax(0,1fr))}.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.phase{display:flex;height:22px;gap:2px;border-radius:4px;overflow:hidden;margin-top:6px;background:var(--sf)}
.phase i{display:block;height:100%}.ph-t{background:var(--s1)}.ph-b{background:var(--s2)}.ph-c{background:var(--s3)}
.phlg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.phlg div{display:grid;grid-template-columns:12px 1fr;gap:2px 10px;align-items:center}
.phlg i{width:12px;height:12px;border-radius:3px}.phlg b{font:600 14px var(--f-body)}.phlg span{grid-column:2;font:500 13px var(--f-data);color:var(--mu)}

async function queueXlsx(fname,buf){const sheets=await readXlsx(buf),base=fname.replace(/\.[^.]+$/,''),qs=[];let err='';

if(!qs.length)throw new Error(sheets.length?(sheets.length>1?'None of the sheets has rows of lap data.':err):'The workbook is empty.');queue.push(...qs)}
async function handleFiles(files){msgs=[];armed=false;for(const f of files){try{if(/\.xls$/i.test(f.name))throw new Error('That is an old Excel file (.xls). In Excel choose File, Save As, Excel Workbook (.xlsx) or CSV, then load that.');if(/\.(ods|numbers)$/i.test(f.name))throw new Error('Pacely reads Excel (.xlsx) and CSV files. Export this spreadsheet as one of those, or copy the cells and press Ctrl+V here.');
const buf=await f.arrayBuffer();const u=new Uint8Array(buf.slice(0,4));if(u[0]===0x50&&u[1]===0x4b){await queueXlsx(f.name,buf);continue}let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){text=new TextDecoder('windows-1252').decode(buf)}const q=prepare(f.name,text);queue.push(q)}catch(e){msgs.push({t:`${f.name}: ${e.message}`,bad:true})}}advance();if(sessions.length&&!imp)window.scrollTo({top:0})}
function handleText(text,name){msgs=[];armed=false;try{queue.push(prepare(name||'Pasted data',text))}catch(e){msgs.push({t:`${name||'Pasted data'}: ${e.message}`,bad:true})}advance();if(sessions.length&&!imp)window.scrollTo({top:0})}

const aiState={};
const AI_SYSTEM="You are the assistant inside Pacely, a race-data app for club and mid-tier motorsport teams. Answer using ONLY the session facts provided. Never invent numbers, laps, corners or causes that are not in the facts. If the facts do not answer the question, say so and say what extra data would help. Use plain, direct English that a driver or team boss understands. No markdown, no bullet symbols, no emojis. Keep answers under 110 words unless asked for more. Give advice as suggestions to confirm with the driver and the race situation, not as certainties.";
const inf=v=>v===Infinity?'no limit':v;
function aiContext(a,s){const m=s.meta;return JSON.stringify({session:s.name,conditions:{compound:a.st.c||m.compound||null,tyreAgeWhenFittedLaps:a.st.age0,trackTempC:m.trackTemp||null,airTempC:m.airTemp||null,lapsToGo:a.rem,raceFinished:a.rem===0},racePicture:racePicFacts(s,a),stints:stintRows(s,a).map(r=>({stint:r.t.i+1,laps:`${r.t.first}-${r.t.last}`,compound:r.t.c||null,tyreAgeWhenFittedLaps:r.t.age0,tyreLossPerLapS:+r.rate.toFixed(3),fuelCorrectedPaceS:+r.pace.toFixed(3),bestLapS:+r.best.toFixed(3)})),settings:{pitStopCostSeconds:a.thr,fuelGainSecondsPerLap:a.fuel,fuelEffectSource:a.fuelSrc||null},
stint:{firstLap:a.st.first,lastLap:a.st.last,cleanLaps:a.n,leftOutLaps:a.run.ignored.map(x=>x.lap+' ('+x.why+')')},raceCall:call(a),
numbers:{tyreLossPerLapAverage:+a.rateAvg.toFixed(3),tyreLossPerLapNow:+a.rateNow.toFixed(3),lostSoFarSeconds:+a.lossNow.toFixed(2),lapsUntilStopPaysOff:{low:inf(a.left.low),high:inf(a.left.high)},lapTimeScatterSeconds:+a.resid.toFixed(3),confidence:a.conf,wearAccelerating:a.useQuad},
findings:a.F.map(f=>({severity:f.sev,title:f.t,whatWeSee:f.ev,whatToDo:f.ac})),corners:a.table.map(r=>({corner:r.c,status:r.st,note:r.dt,numbers:r.nums})),cleanLapTimes:a.st.laps.map(l=>[l.lap,+l.t.toFixed(3)])})}
async function askAI(messages,onText,signal){
try{if(window.claude&&window.claude.use){const sm=await window.claude.use('sample');if(sm){const input=[{role:'user',content:AI_SYSTEM+'\n\n'+messages[0].content}];const r=await sm(input,{onText:({text})=>onText(text),signal,cache:false,modelTier:'quick'});return r.text}}}catch(e){if(e&&e.code&&e.code!=='unavailable')throw e}
if(!/^https?:$/.test(location.protocol))throw{code:'local'};
const res=await fetch('/.netlify/functions/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({system:AI_SYSTEM,messages}),signal});
if(!res.ok){let m='';try{m=(await res.json()).error}catch(e){}throw{code:'http',status:res.status,message:m}}
const j=await res.json();onText(j.text);return j.text}
function aiErr(e){if(!e)return'Something went wrong.';if(e.name==='AbortError')return'That took too long, so it was cancelled. Try again.';if(e.code==='local')return'AI works once Pacely is hosted with the AI function switched on. See the README.';
if(e.code==='not_granted')return'Permission to use Claude was declined. Tap the button again and allow it.';if(e.code==='rate_limited'||e.status===429)return'Too many requests right now. Wait a minute and try again.';
if(e.code==='http'){if(e.status===404)return'AI is not set up on this site yet. See the README to switch it on.';return e.message||'The AI service did not respond.'}
if(navigator.onLine===false)return'AI needs an internet connection.';return e.message||'The AI service did not respond.'}
function aiBlock(s,kind){const K=AIK[kind],st=aiState[s.id+':'+kind]||{log:[]},last=st.log.length-1;
return`<section class="ai noprint" data-kind="${kind}"><div class="card">
<p class="hint" style="margin-top:0">Ask questions about ${K.what} in plain English. The answers use only the numbers on this page and can be wrong, so check them against the data. Using it sends these numbers, not your files, to Claude.</p>
<div class="row" style="margin-top:14px"><button id="aiExplain" ${st.busy?'disabled':''}>${K.label}</button></div>
<div class="chips">${K.chips.map(q=>`<button class="chip aiq" data-q="${esc(q)}" ${st.busy?'disabled':''}>${esc(q)}</button>`).join('')}</div>
<div class="row" style="margin-top:12px;flex-wrap:nowrap"><input type="text" id="aiq" placeholder="${K.ph}" style="flex:1;min-width:0"><button class="alt" id="aiAsk" ${st.busy?'disabled':''}>Ask</button></div>
<div id="aiLog" aria-live="polite">${st.log.map((x,i)=>`<div class="aiu">${esc(x.q)}</div>${x.err?`<p class="err" role="alert">${esc(x.err)}</p>`:`<div class="aia" ${st.busy&&i===last?'id="aiCur"':''}>${esc(x.a)||'Thinking…'}</div>`}`).join('')}</div></div></section>`}
const aiSection=(s,kind)=>`<h2 class="noprint">AI engineer <small>optional</small></h2>${aiBlock(s,kind)}`;
async function aiRun(s,q,label,kind){kind=kind||'call';const st=aiState[s.id+':'+kind]=aiState[s.id+':'+kind]||{log:[]};if(st.busy)return;let facts;
if(kind==='call'){let a;try{a=analyse(s)}catch(e){return}facts=aiContext(a,s)}else{facts=AICTX[kind+':'+s.id];if(!facts)return}
const item={q:label||q,a:'',err:''};const prev=st.log.filter(x=>x.a).slice(-2).map(x=>`Q: ${x.q}\nA: ${x.a}`).join('\n\n');
st.log.push(item);if(st.log.length>8)st.log.shift();st.busy=true;render();
const content=`${AIK[kind].facts} (JSON):\n${facts}\n\n${prev?'Earlier in this conversation:\n'+prev+'\n\n':''}${q}`,ac=new AbortController(),to=setTimeout(()=>ac.abort(),45000);
try{await askAI([{role:'user',content}],t=>{item.a=t;const e=$('#aiCur');if(e)e.textContent=t},ac.signal)}catch(e){item.err=aiErr(e)}
clearTimeout(to);st.busy=false;if(sessions[cur]===s&&view==='single')render()}
const AI_EXPLAIN="Write a short engineer's summary of this session for the team: what is happening, the single most important thing to do, and one thing to tell the driver. Under 110 words.";
const AICTX={},AIK={call:{what:'this race session',facts:'Session facts',label:'Explain this session',explain:AI_EXPLAIN,chips:['Why is the car pushing wide?','When should I pit?','What should I tell the driver?'],ph:'Ask about this session'},
quali:{what:'this qualifying session',facts:'Qualifying facts',label:'Debrief this session',explain:"Write a short qualifying debrief for the driver and engineer: where the lap time is, the biggest gain still available, and one thing to try on the next run. Under 110 words.",chips:['Where is my lap time?','How do I reach my ideal lap?','When do the tyres work best?'],ph:'Ask about this qualifying session'},
tele:{what:'this lap',facts:'Lap telemetry facts',label:'Debrief this lap',explain:"Write a short engineer's debrief of this lap: where it is strong, where it loses time against the reference lap and why, and the single most useful change for the driver. Under 110 words.",chips:['Where am I losing time?','How is my braking?','What should I tell the driver?'],ph:'Ask about this lap'}};

A=first;B=first+1;cmpSt={A:null,B:null};cur=first;view='single';tab='call';render()};
{const ov=$('#dropov');let dc=0;const hasF=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{if(hasF(e)){e.preventDefault();dc++;ov.classList.add('on')}});
addEventListener('dragover',e=>{if(hasF(e))e.preventDefault()});
addEventListener('dragleave',e=>{if(hasF(e)){dc=Math.max(0,dc-1);if(!dc)ov.classList.remove('on')}});

const pb=$('#paste');if(pb)pb.onclick=async()=>{try{const x=await navigator.clipboard.readText();if(x.trim())handleText(x,'Pasted data');else toast('Nothing to paste. Copy your cells first.')}catch(e){toast('Press Ctrl+V (or Cmd+V) anywhere on this page to paste.')}};
$('#file').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)await handleFiles(fs)};

addEventListener('beforeprint',()=>{if(sessions.length&&tab!=='compare'){printing=true;render()}});addEventListener('afterprint',()=>{if(printing){printing=false;render()}});
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('pacely-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('pacely-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
{let nw=narrow();addEventListener('resize',()=>{if(narrow()!==nw){nw=narrow();if(sessions.length)render()}})}

if(!ok)return;const saved=(await DB.all()).sort((a,b)=>a.created-b.created);if(saved.length&&!sessions.length){sessions=saved;cur=sessions.length-1;A=0;B=Math.min(1,sessions.length-1);render()}});
