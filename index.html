<style>
:root{--bg:#e6e9ec;--sf:#fff;--sf2:#eef1f3;--tx:#14181c;--mu:#59646e;--ln:#d3d9de;--lnb:#b4bdc5;--ac:#d4160c;--acx:#fff;--wn:#a35a00;--wnbg:#fff3de;--bd:#c4120a;--bdbg:#fde8e6;--ok:#16794a;--okbg:#e2f3ea;--bar:#101316;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1013;--sf:#171b1f;--sf2:#1f2429;--tx:#e9edf0;--mu:#8f9ba6;--ln:#2b333a;--lnb:#3c464f;--ac:#e5170d;--acx:#fff;--wn:#f2a71b;--wnbg:#2b2310;--bd:#ff5247;--bdbg:#2f1614;--ok:#38c97f;--okbg:#10271c;--bar:#080a0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1013;--sf:#171b1f;--sf2:#1f2429;--tx:#e9edf0;--mu:#8f9ba6;--ln:#2b333a;--lnb:#3c464f;--ac:#e5170d;--acx:#fff;--wn:#f2a71b;--wnbg:#2b2310;--bd:#ff5247;--bdbg:#2f1614;--ok:#38c97f;--okbg:#10271c;--bar:#080a0c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:0 16px 48px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 14px;border-bottom:3px solid var(--ac)}
.mark{display:flex;align-items:center;gap:10px}
.slashes{display:flex;gap:4px;transform:skewX(-24deg)}.slashes i{display:block;width:9px;height:26px;background:var(--ac)}.slashes i+i{width:4px;opacity:.55}

.tools{display:flex;gap:8px}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

details.set{margin-top:12px;border-top:1px solid var(--ln);padding-top:10px}summary{cursor:pointer;color:var(--mu);font-weight:600;padding:6px 0}

input[type=number],input[type=text],select{font:inherit;font-size:16px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-height:44px;max-width:100%}
input[type=number]{width:110px}input[type=text]{width:100%}
.hint{color:var(--mu);font-size:14px;margin:10px 0 0}
.empty{margin-top:20px;padding:34px 20px;text-align:center;color:var(--mu);border:2px dashed var(--ln);border-radius:10px}.empty b{display:block;font-size:20px;color:var(--tx);margin-bottom:6px}
.call{border-radius:12px;padding:20px;border:2px solid var(--ln);background:var(--sf);margin-top:22px}

.call .k{font-size:14px;font-weight:700;color:var(--mu)}
.call .big{font-size:clamp(28px,8vw,40px);line-height:1.1;font-weight:800;margin:4px 0 6px;letter-spacing:-.01em}
.call .why{color:var(--tx);opacity:.85;margin:0}.call .conf{color:var(--mu);font-size:14px;margin:6px 0 0}
.call .row{margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}

.tile{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--sf2);color:var(--tx);white-space:nowrap}
.high>.tag,.tag.high{background:var(--bd);color:#fff}.med>.tag,.tag.med{background:var(--wn);color:#fff}.ok>.tag,.tag.ok{background:var(--ok);color:#fff}
:root[data-theme="dark"] .med>.tag,:root[data-theme="dark"] .tag.med,:root[data-theme="dark"] .ok>.tag,:root[data-theme="dark"] .tag.ok{color:#111}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .med>.tag,:root:not([data-theme="light"]) .tag.med,:root:not([data-theme="light"]) .ok>.tag,:root:not([data-theme="light"]) .tag.ok{color:#111}}
.f{margin:10px 0;padding:16px;background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--ln);border-radius:10px}
.f.high{border-left-color:var(--bd)}.f.med{border-left-color:var(--wn)}.f.ok{border-left-color:var(--ok)}
.f h3{font-size:19px;line-height:1.25;margin:8px 0 10px}
.f dl{margin:0;display:grid;gap:8px}.f dt{font-size:13px;font-weight:700;color:var(--mu)}.f dd{margin:0}
.cor{display:grid;gap:8px}
.cr{display:grid;grid-template-columns:56px auto 1fr;gap:6px 12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.cr .nm{font-size:20px;font-weight:800}.cr .dt{color:var(--mu);font-size:15px}
.cr .nums{grid-column:1/-1;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block}.axis{stroke:var(--ln)}.grid{stroke:var(--ln);stroke-dasharray:3 5}
.trace{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round}.dot{fill:var(--sf);stroke:var(--ac);stroke-width:2.5}
.fitc{fill:none;stroke:var(--tx);stroke-width:2;opacity:.8}.fitp{fill:none;stroke:var(--tx);stroke-width:2;stroke-dasharray:5 4;opacity:.8}
.band{fill:var(--wn);opacity:.2}.flag{stroke:var(--tx);stroke-width:2}
.t{fill:var(--mu);font-size:12px}
.foot{color:var(--mu);font-size:13px;margin-top:26px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px;max-width:92vw}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.chip{background:var(--sf);color:var(--tx);border:2px solid var(--ln);border-radius:99px;padding:8px 14px;min-height:40px;font-size:15px}
.chip.on{border-color:var(--ac);background:var(--sf2)}.chip.dim{opacity:.6}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.pick{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:620px){.pick{grid-template-columns:1fr 1fr}}
.pk{display:grid;gap:10px;align-content:start}.pick label,.fld{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:14px;font-weight:700}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin-bottom:8px}.lg span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid var(--ac)}.sw.b{border-top:3px dashed var(--tx)}
.traceB{fill:none;stroke:var(--tx);stroke-width:2.5;stroke-dasharray:6 4;stroke-linejoin:round}.mkB{fill:var(--sf);stroke:var(--tx);stroke-width:2.5}
table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th{font-size:13px;color:var(--mu);text-align:right;padding:8px 6px;border-bottom:1px solid var(--ln)}.cmp td{text-align:right;padding:11px 6px;border-bottom:1px solid var(--ln);font-size:16px}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-size:15px}.cmp tr:last-child td{border-bottom:0}
.cmp td.win{font-weight:800;color:var(--ok)}
.chg{list-style:none;margin:0;padding:0;display:grid;gap:10px}.chg li{display:flex;gap:10px;align-items:flex-start}.chg .tag{flex:none;margin-top:2px}
.cc{display:grid;grid-template-columns:48px 1fr 1fr;gap:8px 10px;align-items:start;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.cc .nm{font-size:20px;font-weight:800}.cc small{display:block;color:var(--mu);font-size:13px;margin-top:4px}
.cch{display:grid;grid-template-columns:48px 1fr 1fr;gap:10px;padding:0 14px;font-size:13px;font-weight:700;color:var(--mu)}
.notice{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--wnbg);border:1px solid var(--wn);font-size:15px}
.notice.bad{background:var(--bdbg);border-color:var(--bd)}
.verdict{border-radius:12px;padding:18px 20px;border:2px solid var(--ac);background:var(--sf);margin-top:18px}.verdict .big{font-size:clamp(24px,7vw,34px);font-weight:800;line-height:1.15;margin:4px 0}.verdict .k{font-size:14px;font-weight:700;color:var(--mu)}.verdict p{margin:6px 0 0;color:var(--mu);font-size:15px}
.inl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.inl label{font-weight:700;font-size:15px}
.stint{margin-top:18px}.stint .sum{margin:10px 0 0;font-size:15px}.stint .ign{color:var(--mu);font-size:14px;margin:4px 0 0}
.grid2{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.mrow{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0}@media(min-width:560px){.mrow{grid-template-columns:200px 1fr;align-items:center;gap:12px}}
.mrow>span{font-weight:700;font-size:15px}.mrow>span small{display:block;color:var(--mu);font-weight:400;font-size:13px}
.pv{overflow-x:auto;margin-top:10px;border:1px solid var(--ln);border-radius:8px}.pv table{border-collapse:collapse;font-size:13px;white-space:nowrap}.pv th,.pv td{padding:5px 9px;border-bottom:1px solid var(--ln);text-align:left}.pv th{color:var(--mu);font-weight:700}.pv tr:last-child td{border-bottom:0}
.err{color:var(--bd);font-weight:700;margin:10px 0 0}
.aiu{font-weight:700;margin-top:16px}.aia{white-space:pre-wrap;margin-top:6px;padding:12px 14px;background:var(--sf2);border-radius:10px;line-height:1.5}
.ai button[disabled]{opacity:.6;cursor:default}
.sessel{display:flex;flex-direction:column;gap:4px;margin-top:16px;color:var(--mu);font-size:14px;font-weight:700}.sessel select{width:100%;max-width:420px}
.f .do{margin:0;font-weight:600}.f details.why{margin:6px 0 0}.f details.why summary{font-size:14px;padding:2px 0}.f details.why p{margin:4px 0 0;color:var(--mu);font-size:15px}
.tile .n{font-size:24px}.tile .l{font-size:13px}
.pklist{max-height:340px;overflow:auto;margin-top:10px;border:1px solid var(--ln);border-radius:8px}.pkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.pkrow:last-child{border-bottom:0}.pkrow span{margin-left:auto;color:var(--mu);font-size:14px}.pkrow input{width:20px;height:20px}
.readn{margin:14px 0 0;color:var(--mu);font-size:14px}button.link{background:none;border:0;color:var(--tx);text-decoration:underline;padding:0;min-height:0;font-weight:600;display:inline;cursor:pointer}
.printhead,.printonly{display:none}
.tabs{display:flex;gap:2px;margin:14px 0 0;border-bottom:1px solid var(--ln);overflow-x:auto}
.tabs button{background:none;color:var(--mu);border:0;border-bottom:3px solid transparent;border-radius:0;min-height:46px;padding:10px 16px;font-weight:700;font-size:16px}
.tabs button:hover{filter:none;color:var(--tx)}.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.tabs button:disabled{opacity:.45;cursor:default}
.fgrid{display:block}.tabpane{margin-top:4px}
@media(max-width:699px){#out>.chips{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding-right:16px;scrollbar-width:none}#out>.chips .chip{flex:none;white-space:nowrap}}
@media(max-width:699px){
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;background:var(--sf);border-top:2px solid var(--ac);border-bottom:0;padding:0 2px env(safe-area-inset-bottom,0px);justify-content:space-between;overflow:visible}
.tabs button{flex:1;min-width:0;padding:10px 2px 9px;font-size:12px;border-bottom:0;border-top:3px solid transparent;margin-top:-2px}
.tabs button.on{border-top-color:var(--ac)}
main{padding-bottom:92px}.toast{bottom:84px}}
@media(min-width:1000px){.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}.cor{grid-template-columns:1fr 1fr}}

.dash,.hero,.colL,.colR{display:block}
.dropov{display:none}
@media(min-width:1000px){
main{max-width:1280px;padding:0 32px 64px}
.bar{padding:20px 0 16px}h1{font-size:30px}
.card.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 28px}.card.ctrl>.row{flex:none}.card.ctrl details.set{flex:1 1 100%;order:3;margin-top:8px}.card.ctrl>.hint{margin:0;flex:1 1 280px}
.call .big{font-size:44px}.tiles{margin-top:16px}.tile{padding:16px 18px}.tile .n{font-size:30px}.tile .l{font-size:14px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
.dash .colL>h2:first-child,.dash .colR>h2:first-child{margin-top:26px}
.dash.cmpd{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.pick{grid-template-columns:1fr 1fr}
.mrow{grid-template-columns:280px minmax(0,420px)}
#out>.card{max-width:860px}
.chip:hover,.chip.on{border-color:var(--ac)}
.dropov{position:fixed;inset:0;z-index:50;background:rgba(14,11,12,.82);color:#fff;align-items:center;justify-content:center;font:800 40px/1.2 "Arial Black",sans-serif;letter-spacing:-.02em;border:6px dashed var(--ac);margin:14px;border-radius:18px}
.dropov.on{display:flex}
}
@media(min-width:1500px){main{max-width:1440px}.dash{gap:0 36px}}
@media print{
.hero,.dash,.fgrid,.cor{display:block!important}.tabs{display:none!important}.dropov{display:none!important}
:root,:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#fff;--sf:#fff;--sf2:#eee;--tx:#111;--mu:#555;--ln:#ccc;--ac:#c40a0a;--wn:#a85f00;--wnbg:#fff4e0;--bd:#c40a0a;--bdbg:#fde8e6;--ok:#17743f;--okbg:#e6f5ec;color-scheme:light}
body{font-size:12pt}.top,.ctx,.bar .tools,.card.ctrl,.chips,.ctl,.noprint,button,.notice,.stint details,details.set{display:none!important}
.printhead{display:block;margin:10px 0 0}.printhead p{margin:4px 0;color:var(--mu)}.printonly{display:block}
.f,.card,.call,.tile,.cr,.cc{break-inside:avoid}.call{margin-top:12px}
}

/* ---- instrument theme ---- */
:root{--num:"Bahnschrift","DIN Alternate","DIN 1451 Std","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
body{font:15px/1.5 "Segoe UI",Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:var(--bar);color:#eef1f3;border-bottom:3px solid var(--ac)}
.topin{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:28px;min-height:54px}
.top .mark{gap:9px}.top h1{font:700 22px/1 var(--num);letter-spacing:.01em;color:#fff}
.top .slashes i{height:21px;width:7px}.top .slashes i+i{width:3px}
.top .tools{margin-left:auto}
.top .tools button{background:transparent;color:#c9d1d7;border:1px solid #38424a;min-height:34px;padding:4px 11px;font-size:13px;font-weight:600}
.top .tools button:hover{filter:none;border-color:#6b7782;color:#fff}
.top nav.tabs{display:flex;border:0;margin:0;gap:2px;overflow:visible}
.top .tabs button{background:none;color:#a9b3bb;border:0;border-bottom:3px solid transparent;margin-bottom:-3px;border-radius:0;min-height:54px;padding:0 16px;font:600 15px var(--num);letter-spacing:.03em}
.top .tabs button:hover{color:#fff;filter:none}.top .tabs button.on{color:#fff;border-bottom-color:var(--ac)}
main{padding-top:4px}
h2{display:flex;align-items:center;gap:12px;font:600 13px/1 var(--num);letter-spacing:.05em;color:var(--mu);margin:28px 0 10px}
h2::after{content:"";flex:1;height:1px;background:var(--ln)}
.card,.tile,.f,.cr,.cc,.call,.verdict,.empty,.notice,.pv,.ctx,.pklist{border-radius:3px}
.card{padding:16px 18px;border-color:var(--ln)}
button,label.btn{border-radius:3px;font-weight:600;letter-spacing:.005em;min-height:44px}
button.alt,label.btn{background:var(--sf);color:var(--tx);border:1px solid var(--lnb)}
button.alt:hover,label.btn:hover{background:var(--sf2);filter:none}
button.sm{min-height:38px}
.top .tools button.alt{background:transparent}
input[type=number],input[type=text],select{border-radius:3px;border-color:var(--lnb);background:var(--sf)}
.tag{border-radius:2px;font-size:12px;font-weight:700;padding:2px 8px;letter-spacing:.01em}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:10px 30px;margin-top:16px;padding:10px 16px;background:var(--sf);border:1px solid var(--ln);border-top:3px solid var(--ln)}
.ctx .cs{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--mu)}.ctx .cs b{color:var(--tx);font-size:15px}.ctx select{min-height:36px;padding:4px 8px;font-size:15px;font-weight:600;max-width:100%}
.facts{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0}.facts div{display:flex;align-items:baseline;gap:8px}
.facts dt{font-size:12px;color:var(--mu);font-weight:600}.facts dd{margin:0;font:600 18px/1 var(--num);font-variant-numeric:tabular-nums}.facts dd.sm{font:600 14px/1.2 "Segoe UI",system-ui,sans-serif}
.call{padding:20px 22px;background:var(--sf);border:1px solid var(--ln);border-left:8px solid var(--lnb);margin-top:16px}
.call.high{border-left-color:var(--bd);background:var(--sf)}.call.med{border-left-color:var(--wn);background:var(--sf)}.call.ok{border-left-color:var(--ok);background:var(--sf)}
.call .k{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--mu)}
.call .k::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--lnb);flex:none}
.call.high .k::before{background:var(--bd)}.call.med .k::before{background:var(--wn)}.call.ok .k::before{background:var(--ok)}
.call .big{font:700 clamp(30px,7vw,48px)/1.04 var(--num);letter-spacing:.005em;margin:8px 0 8px}
.call .why{font-size:16px;opacity:1;max-width:70ch}
.tiles{gap:12px;margin-top:12px}
.tile{padding:14px 16px 13px;border:1px solid var(--ln);border-top:3px solid var(--lnb)}
.tile .n{font:600 clamp(26px,5vw,36px)/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.005em}
.tile .n small{font:600 14px var(--num);color:var(--mu);margin-left:2px}
.tile .l{font-size:13px;color:var(--mu);margin-top:8px;line-height:1.3}
.f{padding:13px 16px 12px;border-left-width:5px;margin:10px 0}
.f h3{font-size:16px;margin:8px 0 6px;line-height:1.3}.f .do{font-size:15px}
.cr,.cc{padding:11px 14px}.cr .nm,.cc .nm{font:700 20px var(--num)}
.verdict{border:1px solid var(--ln);border-left:8px solid var(--ac);padding:18px 22px}
.verdict .big{font:700 clamp(26px,6vw,38px)/1.1 var(--num)}
table.cmp{font-variant-numeric:tabular-nums}.cmp th{background:var(--sf2);color:var(--mu);font-weight:600;font-size:12px;padding:9px 8px}.cmp td{font:600 16px var(--num);padding:11px 8px}.cmp td:first-child{font:500 14px "Segoe UI",system-ui,sans-serif}

else{const ns=Math.max(0,...s.laps.map(l=>l.s?l.s.length:0));csv='lap,lap_time'+[...Array(ns)].map((_,i)=>',s'+(i+1)).join('')+'\n'+s.laps.map(l=>l.lap+','+f(l.t)+[...Array(ns)].map((_,i)=>','+(l.s&&l.s.length===ns?f(l.s[i]):'')).join('')).join('\n')+'\n'}
const fn=(s.name.replace(/[^\w-]+/g,'-')||'session')+'.csv';let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}

try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fn;document.body.append(a);a.click();a.remove()}catch(e){toast('Download is not available here.')}}

function groupInfo(q){if(q.shape!=='laps'||q.nosplit)return null;const L=q.names.map(n=>n.toLowerCase().replace(/[^a-z0-9#]+/g,' ').trim());
const pats=[/^(car |vehicle |start |race )?(number|no|num|#)$/,/^car( id| name)?$/,/^vehicle/,/^(entry|entrant|competitor)/,/^team( name)?$/];
const skip=new Set([q.map.lap,q.map.lapTime]);
for(const re of pats){const i=L.findIndex((n,k)=>re.test(n)&&!skip.has(k));if(i<0)continue;const g=new Map();q.data.forEach(r=>{const k=String(r[i]==null?'':r[i]).trim();if(!k)return;if(!g.has(k))g.set(k,[]);g.get(k).push(r)});
const big=[...g.entries()].filter(([k,v])=>v.length>=3);if(big.length>=2&&big.length<=150&&big.length>=g.size*.6){
const col=n=>L.findIndex(x=>n.test(x)),ti=col(/^team|^entrant|^entry/),mi=col(/^manufacturer|^make|^car ?model/),ci=col(/^class|^category/);
return{col:i,isNum:/number|no|num|#/.test(L[i]),groups:big.map(([k,rows])=>{const r0=rows[0];return{key:k,rows,team:ti>=0?String(r0[ti]||'').trim():'',make:mi>=0?String(r0[mi]||'').trim():'',cls:ci>=0?String(r0[ci]||'').trim():'',sel:true}})}}}
return null}
function gName(gi,g){const k=gi.isNum&&/^\d+$/.test(g.key)?'#'+g.key:g.key;const x=[g.team||g.make].filter(Boolean)[0];return k+(x&&x!==g.key?' '+x:'')+(g.cls?` (${g.cls})`:'')}
const SRC=new Map();
function loadQ(q,notes){const gi=q.group===undefined?groupInfo(q):null;
if(gi){q.gi=gi;if(gi.groups.length>8){gi.groups.forEach(g=>g.sel=false);q.pick=true;return 'pick'}return loadGroups(q,gi.groups,notes)}
const ss=build(q);addSession(ss);SRC.set(ss.id,q);return 'ok'}
function loadGroups(q,gs,notes){let n=0,bad=0;for(const g of gs){try{const q2={...q,data:g.rows,nosplit:true,name:gName(q.gi,g),pick:false};const ss=build(q2);ss.name=q2.name;addSession(ss);SRC.set(ss.id,q2);n++}catch(e){bad++}}
if(!n)throw new Error('None of the cars in this file had enough laps (at least 5).');notes.push(`Loaded ${n} cars from ${q.name}.`+(bad?` ${bad} skipped (too few laps).`:''));return 'ok'}
function remember(q){try{localStorage.setItem('pacely-map:'+q.sig,JSON.stringify({shape:q.shape,map:q.map,units:q.units}))}catch(e){}}
function addSession(s){const n=sessions.filter(x=>x.name===s.name||x.name.startsWith(s.name+' (')).length;if(n)s.name=`${s.name} (${n+1})`;sessions.push(s);cur=sessions.length-1;view='single';tab='call';save(s);return s}
function prepare(name,text){const d=detectDelim(text);return prepareRows(name,splitRows(text,d),d===';')}
function prepareRows(name,rows,dec){const loc=locate(rows,dec),g=guess(loc.names,loc.units,loc.data,dec),sig=loc.names.join('|').slice(0,300);
const q={name,names:loc.names,colUnits:loc.units,data:loc.data,dec,sig,shape:g.shape,map:g.map,units:g.units,remember:true,auto:g.exact};
try{const sv=JSON.parse(localStorage.getItem('pacely-map:'+sig)||'null');if(sv&&sv.shape&&sv.map){q.shape=sv.shape;q.map=sv.map;q.units={...q.units,...sv.units};q.auto=true}}catch(e){}
return q}
function advance(){imp=null;const notes=[];while(queue.length){const q=queue[0];let r='fail';if(!q.manual){try{r=loadQ(q,notes)}catch(e){if(q.auto)msgs.push({t:`${q.name}: ${e.message}`,bad:true});r=q.auto?'bad':'fail'}}if(r==='ok'||r==='bad'){queue.shift();continue}if(r==='pick'){imp=q;break}q.manual=true;imp=q;break}if(notes.length)msgs.push({t:notes.join(' ')});render()}
async function queueXlsx(fname,buf){const sheets=await readXlsx(buf),base=fname.replace(/\.[^.]+$/,''),qs=[];let err='';
for(const sh of sheets){try{qs.push(prepareRows(sheets.length>1?`${base} – ${sh.name}.xlsx`:fname,sh.rows,false))}catch(e){err=e.message}}
if(!qs.length)throw new Error(sheets.length?(sheets.length>1?'None of the sheets has rows of lap data.':err):'The workbook is empty.');queue.push(...qs)}
async function handleFiles(files){msgs=[];armed=false;for(const f of files){try{if(/\.xls$/i.test(f.name))throw new Error('That is an old Excel file (.xls). In Excel choose File, Save As, Excel Workbook (.xlsx) or CSV, then load that.');if(/\.(ods|numbers)$/i.test(f.name))throw new Error('Pacely reads Excel (.xlsx) and CSV files. Export this spreadsheet as one of those, or copy the cells and press Ctrl+V here.');
const buf=await f.arrayBuffer();const u=new Uint8Array(buf.slice(0,4));if(u[0]===0x50&&u[1]===0x4b){await queueXlsx(f.name,buf);continue}let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){text=new TextDecoder('windows-1252').decode(buf)}const q=prepare(f.name,text);queue.push(q)}catch(e){msgs.push({t:`${f.name}: ${e.message}`,bad:true})}}advance();if(sessions.length&&!imp)window.scrollTo({top:0})}
function handleText(text,name){msgs=[];armed=false;try{queue.push(prepare(name||'Pasted data',text))}catch(e){msgs.push({t:`${name||'Pasted data'}: ${e.message}`,bad:true})}advance();if(sessions.length&&!imp)window.scrollTo({top:0})}
